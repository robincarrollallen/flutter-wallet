name: CI

# 验证发生在**合并之前**：PR targeting main / release 都会跑全套。
#
# push 上刻意不留 main——进 main 的代码必然已经以 PR 形式绿过一次，合并后再跑一遍
# 是同一份代码的重复验证，只是多烧一次 runner。release 保留 push 触发：那是发布分支，
# 可能收到 cherry-pick 或 hotfix 这类不经 PR 的直接推送，需要兜底。
on:
  push:
    branches: [release]
  pull_request:
    branches: [main, release]

# 同一分支上新的 push 取消仍在跑的旧任务，省 runner 时间。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          # 与本地开发版本一致，避免 CI 因 SDK 漂移而红/绿不一致。
          # 必须 >= pubspec 里声明的 flutter 下限（当前 3.47.0），否则 pub get 直接报版本不匹配。
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: 安装依赖
        run: flutter pub get

      # 行宽由 analysis_options.yaml 的 formatter.page_width 决定（本项目为 120）。
      # 该配置里的 `include:` 需要包解析才能生效，所以本步骤必须排在 pub get 之后——
      # 缺少 .dart_tool 时配置会被静默忽略、退回 80 宽，导致整仓误报。
      - name: 格式检查
        run: dart format --output=none --set-exit-if-changed lib test

      # 基线已收紧到 0 diagnostic（原先容忍的 5 项 warning/info 已全部清掉），
      # 所以不再需要 --no-fatal-infos / --no-fatal-warnings：任何新增的
      # warning 或 info 都会让 CI 红，避免告警重新堆积成「反正一直有几条」的背景噪音。
      - name: 静态分析
        run: flutter analyze

      - name: 分层约束
        run: ./tool/check_layers.sh

      - name: 单元测试
        run: flutter test

      # slang 生成物（lib/i18n/*.g.dart）已入库。改了 locale json 却忘了重新生成，
      # 这里会让差异显形。生成物头部带构建时间戳，每次生成都变，故忽略该行。
      - name: 校验 i18n 生成物是否最新
        run: |
          dart run slang
          CHANGES=$(git diff -- lib/i18n | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' | grep -v 'Built on' || true)
          if [ -n "$CHANGES" ]; then
            echo "::error::lib/i18n 生成物与 locale json 不同步，请在本地执行 dart run slang 后提交"
            echo "$CHANGES"
            exit 1
          fi
