name: CI

on:
  push:
    branches: [release]
  pull_request:
    branches: [release]

# 同一分支上新的 push 取消仍在跑的旧任务，省 runner 时间。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # 与本地开发版本一致，避免 CI 因 SDK 漂移而红/绿不一致。
          flutter-version: 3.38.3
          channel: stable
          cache: true

      - name: 安装依赖
        run: flutter pub get

      # 行宽由 analysis_options.yaml 的 formatter.page_width 决定（本项目为 120）。
      # 该配置里的 `include:` 需要包解析才能生效，所以本步骤必须排在 pub get 之后——
      # 缺少 .dart_tool 时配置会被静默忽略、退回 80 宽，导致整仓误报。
      - name: 格式检查
        run: dart format --output=none --set-exit-if-changed lib test

      # 项目当前基线为 0 error，允许 warning/info（多为上游 deprecated API）。
      # 注意 flutter analyze 默认「有任何 diagnostic 就退出码 1」，必须显式关掉这两个开关，
      # 否则 4 条 deprecated info 也会让 CI 红。清理掉既有 5 项后可去掉这两个 flag 收紧。
      - name: 静态分析
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: 分层约束
        run: ./tool/check_layers.sh

      - name: 单元测试
        run: flutter test

      # slang 生成物（lib/i18n/*.g.dart）已入库。改了 locale json 却忘了重新生成，
      # 这里会让差异显形。生成物头部带构建时间戳，每次生成都变，故忽略该行。
      - name: 校验 i18n 生成物是否最新
        run: |
          dart run slang
          CHANGES=$(git diff -- lib/i18n | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' | grep -v 'Built on' || true)
          if [ -n "$CHANGES" ]; then
            echo "::error::lib/i18n 生成物与 locale json 不同步，请在本地执行 dart run slang 后提交"
            echo "$CHANGES"
            exit 1
          fi
